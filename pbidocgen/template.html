<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__ — Power BI Documentation</title>
<style>
:root{
  --bg:#F3F5F7; --panel:#FFFFFF; --panel2:#F8FAFB;
  --ink:#1C2430; --ink2:#61707F; --ink3:#8B98A5;
  --line:#DDE3E9; --line2:#EBEFF3;
  --amber:#B77E00; --pbi:#F2C811;
  --direct:#157A46; --directBg:#E7F5EE;
  --viam:#0E7490; --viamBg:#E6F4F7;
  --poss:#B45309; --possBg:#FBF0E1;
  --none:#B42318; --noneBg:#FBEAE8;
  --fact:#3B4A9F; --factBg:#EAECF8;
  --dim:#0F766E; --dimBg:#E4F3F1;
  --date:#7C3AED; --dateBg:#F1EAFC;
  --other:#61707F; --otherBg:#EEF1F4;
  --warn:#B45309; --info:#61707F;
  --mono:"Cascadia Code","Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
a{color:var(--amber)}
.layout{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
/* ---------------- nav rail ---------------- */
nav{background:var(--panel);border-right:1px solid var(--line);padding:1.1rem .8rem;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-size:.68rem;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:.35rem}
.doc-title{font-weight:600;font-size:1.02rem;line-height:1.25;margin-bottom:1.1rem;word-break:break-word}
.nav-group{font-size:.64rem;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:1rem .5rem .3rem}
.nav-btn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;font:inherit;color:var(--ink2);padding:.42rem .55rem;border-radius:6px;cursor:pointer}
.nav-btn:hover{background:var(--panel2);color:var(--ink)}
.nav-btn.active{background:var(--ink);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--pbi)}
.nav-btn:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.nav-btn .n{font-family:var(--mono);font-size:.68rem;color:inherit;opacity:.65}
.nav-btn.disabled{opacity:.38;cursor:not-allowed}
/* ---------------- content ---------------- */
main{padding:1.4rem 2rem 4rem;max-width:1240px}
main{min-width:0}
.column-scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
.column-scroll table.t{min-width:1000px;border:0;overflow:visible}
.column-scroll th{position:sticky;top:0;z-index:1}
.column-scroll td{min-width:110px;max-width:300px;overflow-wrap:anywhere}
.column-scroll details{min-width:200px;font-size:.8rem}
.column-scroll summary{padding:.25rem .4rem;font-weight:400}
/* mode coupler (signature) */
.coupler{display:flex;align-items:stretch;gap:0;margin-bottom:1.5rem;font-family:var(--mono)}
.coupler .half{flex:1;border:1.5px solid var(--ink);padding:.6rem .9rem;background:var(--panel)}
.coupler .half:first-child{border-radius:8px 0 0 8px;border-right-width:0}
.coupler .half:last-child{border-radius:0 8px 8px 0}
.coupler .joint{width:26px;display:flex;align-items:center;justify-content:center;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);background:var(--pbi);font-weight:700;color:var(--ink)}
.coupler .half.off{background:repeating-linear-gradient(-45deg,var(--panel2),var(--panel2) 6px,var(--line2) 6px,var(--line2) 12px);color:var(--ink3);border-color:var(--line)}
.coupler .joint.off{background:var(--line2);border-color:var(--line);color:var(--ink3)}
.coupler .tag{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.coupler .val{font-size:.86rem;font-weight:600;font-family:var(--sans)}
.coupler .sub{font-size:.7rem;color:var(--ink2)}
/* generic */
h1{font-size:1.45rem;font-weight:650;letter-spacing:-.01em;margin-bottom:.2rem}
h2{font-size:1.05rem;font-weight:650;margin:1.6rem 0 .6rem}
.sub{color:var(--ink2)}
.eyebrow{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1rem 1.1rem;margin-bottom:.8rem}
.grid{display:grid;gap:.8rem}
.grid.c4{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.stat .big{font-size:1.6rem;font-weight:650;font-variant-numeric:tabular-nums}
.stat .lbl{font-size:.74rem;color:var(--ink2)}
table.t{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:.82rem}
table.t th{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:.5rem .7rem;border-bottom:1px solid var(--line);background:var(--panel2)}
table.t td{padding:.44rem .7rem;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
.badge{display:inline-block;font-family:var(--mono);font-size:.62rem;letter-spacing:.05em;padding:.12rem .45rem;border-radius:4px;white-space:nowrap;text-transform:uppercase}
.b-fact{background:var(--factBg);color:var(--fact)} .b-dimension{background:var(--dimBg);color:var(--dim)}
.b-date{background:var(--dateBg);color:var(--date)} .b-other{background:var(--otherBg);color:var(--other)}
.b-direct{background:var(--directBg);color:var(--direct)} .b-viam{background:var(--viamBg);color:var(--viam)}
.b-poss{background:var(--possBg);color:var(--poss)} .b-none{background:var(--noneBg);color:var(--none)}
.b-hidden{background:var(--otherBg);color:var(--ink3)}
.b-warn{background:var(--possBg);color:var(--warn)} .b-info{background:var(--otherBg);color:var(--info)}
.ref{font-family:var(--mono);font-size:.78rem;background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:.05rem .3rem}
.xl{background:none;border:0;padding:0;font:inherit;color:var(--amber);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.xl:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.search{width:260px;max-width:100%;padding:.42rem .6rem;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--panel);margin:0 0 .7rem}
.search:focus{outline:2px solid var(--amber);outline-offset:-1px}
.filter-row{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-bottom:.7rem}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:.22rem .7rem;font-size:.76rem;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.empty{border:1.5px dashed var(--line);border-radius:8px;padding:2rem;text-align:center;color:var(--ink2);background:var(--panel2)}
.empty b{color:var(--ink)}
pre.code{font-family:var(--mono);font-size:.76rem;line-height:1.55;background:#1E242C;color:#D8DEE6;border-radius:6px;padding:.7rem .85rem;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
pre.code .k{color:#7FD1B9}pre.code .s{color:#E5C07B}pre.code .r{color:#8AB8E8}
details{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:.55rem}
details>summary{cursor:pointer;padding:.6rem .9rem;font-weight:600;list-style:none;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
details>summary::before{content:"▸";color:var(--ink3);font-size:.8rem;transition:transform .12s}
details[open]>summary::before{transform:rotate(90deg)}
details>.body{padding:.2rem .9rem .9rem;border-top:1px solid var(--line2)}
.mut{color:var(--ink2);font-size:.8rem}
.pill-list{display:flex;flex-wrap:wrap;gap:.3rem}
.hl{background:var(--pbi)!important;color:var(--ink)!important}
svg text{font-family:var(--sans)}
.lin-node{cursor:pointer}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.76rem;color:var(--ink2);margin:.4rem 0 .8rem}
.legend span{display:flex;align-items:center;gap:.35rem}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block}
@media (max-width:860px){.layout{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;flex-wrap:wrap;gap:.2rem;border-right:0;border-bottom:1px solid var(--line)}.doc-title,.brand,.nav-group{width:100%}main{padding:1rem}}
@media print{nav{display:none}.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout">
  <nav id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<script>
const DATA = /*__DATA__*/null;
/* ============================================================ helpers */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M = DATA.model, R = DATA.report, L = DATA.linked, MODE = DATA.mode;
const has = { model: !!M, report: !!R, linked: !!L };
const num = n => (n ?? 0).toLocaleString();
const typeBadge = t => {
  const map = {fact:"b-fact", dimension:"b-dimension", "date dimension":"b-date"};
  return `<span class="badge ${map[t]||"b-other"}">${esc(t)}</span>`;
};
const usageBadge = u => {
  const map = {direct:["b-direct","direct"], "via measures":["b-viam","via measures"],
               possible:["b-poss","possible"], none:["b-none","no references"]};
  const [cls,lbl] = map[u] || ["b-other",u];
  return `<span class="badge ${cls}">${esc(lbl)}</span>`;
};
const hlDAX = s => esc(s)
  .replace(/\b(CALCULATE|SUMX?|AVERAGEX?|COUNTROWS|DISTINCTCOUNT|FILTER|ALL|ALLEXCEPT|VALUES|RELATED|RELATEDTABLE|DIVIDE|IF|SWITCH|VAR|RETURN|USERELATIONSHIP|DATEADD|DATESYTD|TOTALYTD|SAMEPERIODLASTYEAR|MAXX?|MINX?|SELECTEDVALUE|TREATAS|CALENDARAUTO|CALENDAR|USERPRINCIPALNAME)\b/g,'<span class="k">$1</span>')
  .replace(/(&#39;[^&]*?&#39;\[[^\]]+\]|\b[\w ]+\[[^\]]+\]|\[[^\]]+\])/g,'<span class="r">$1</span>')
  .replace(/(&quot;.*?&quot;)/g,'<span class="s">$1</span>');
const goTable = n => { switchTab("tables"); requestAnimationFrame(()=>flash("tbl-"+slug(n))); };
const goMeasure = n => { switchTab("measures"); requestAnimationFrame(()=>flash("mea-"+slug(n))); };
const slug = s => String(s).replace(/[^\w]+/g,"_");
function flash(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.scrollIntoView({block:"center"});
  if(el.tagName==="DETAILS") el.open = true;
  el.style.boxShadow = "0 0 0 3px var(--pbi)";
  setTimeout(()=>{ el.style.boxShadow=""; }, 1600);
}
const tblLink = n => `<button class="xl" onclick="goTable('${esc(n).replace(/'/g,"\\'")}')">${esc(n)}</button>`;
const meaLink = n => `<button class="xl" onclick="goMeasure('${esc(n).replace(/'/g,"\\'")}')">${esc(n)}</button>`;
const usageOf = t => has.linked ? (L.tableUsage.find(u=>u.table===t)||{}).usage : null;

/* ============================================================ tabs */
const TABS = [
  {id:"overview", label:"Overview", group:"Start", avail:true},
  {id:"columns", label:"Columns", group:"Start", avail:has.model, count:()=>DATA.columns?.columnCount},
  {id:"lineage",  label:"Lineage",  group:"Start", avail:has.linked},
  {id:"usage",    label:"Usage",    group:"Start", avail:has.linked, count:()=>L.tableUsage.filter(u=>u.usage==="none").length ? L.tableUsage.filter(u=>u.usage==="none").length+" unused" : null},
  {id:"pages",    label:"Pages",    group:"Report", avail:has.report, count:()=>R?.pages.length},
  {id:"filters",  label:"Filters",  group:"Report", avail:has.report, count:()=>allFilters().length},
  {id:"manifest", label:"Field manifest", group:"Report", avail:has.report, count:()=>reportManifest().length},
  {id:"tables",   label:"Tables",   group:"Model", avail:has.model, count:()=>M?.tables.length},
  {id:"measures", label:"Measures", group:"Model", avail:has.model, count:()=>M?.measures.length},
  {id:"rels",     label:"Relationships", group:"Model", avail:has.model, count:()=>M?.relationships.length},
  {id:"sources",  label:"Sources",  group:"Model", avail:has.model},
  {id:"security", label:"Security", group:"Model", avail:has.model, count:()=>M?.roles.length||null},
  {id:"warnings", label:"Warnings", group:"Quality", avail:true, count:()=>allWarnings().length||null},
];
const allWarnings = () => [...(M?.warnings||[]), ...(R?.warnings||[]), ...(L?.warnings||[])];
const allFilters = () => !R ? [] : [...R.reportFilters, ...R.pages.flatMap(p=>p.filters)];
const reportManifest = () => has.linked ? L.manifest : (R?.manifest||[]);

function buildNav(){
  const nav = document.getElementById("nav");
  let html = `<div class="brand">PBI Doc Gen</div><div class="doc-title">${esc(DATA.title)}</div>`;
  let group = "";
  for(const t of TABS){
    if(t.group!==group){ group=t.group; html += `<div class="nav-group">${group}</div>`; }
    const c = t.avail && t.count ? t.count() : null;
    html += t.avail
      ? `<button class="nav-btn" id="nav-${t.id}" onclick="switchTab('${t.id}')">${t.label}${c?`<span class="n">${c}</span>`:""}</button>`
      : `<button class="nav-btn disabled" title="Not available in ${MODE} mode" tabindex="-1">${t.label}</button>`;
  }
  nav.innerHTML = html;
}
function switchTab(id){
  const tab = TABS.find(t=>t.id===id);
  if(!tab || !tab.avail) return;
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  const btn = document.getElementById("nav-"+id);
  if(btn) btn.classList.add("active");
  document.getElementById("main").innerHTML = RENDER[id]();
  window.scrollTo(0,0);
  if(id==="rels") drawERD();
  if(id==="lineage") drawLineage();
  if(id==="columns") filterColumns();
}

/* ============================================================ column/page inventory */
let columnSort = {key:"column", direction:1};
let visibleColumns = [];
function rColumns(){
  const a = DATA.columns;
  const headings = [["decision","Deletion assessment"],["usedInReport","Used in report"],
    ["table","Table"],["column","Column"],["page","Report page"],["pageUsage","Page usage"],
    ["pageMeasures","Measures on this page"],["reason","Evidence & source"]];
  return `<h1>Which columns are used?</h1>
    <p class="sub">One row per column and page. Columns with no page usage remain in the list.</p>
    <div class="grid c4" style="margin-top:1rem">${[["Columns",a.columnCount],["Used in report",a.counts["Used in report"]||0],
      ["Deletion candidates",a.counts["Deletion candidate"]||0],["Need review",a.counts.Review||0]].map(([label,n])=>
      `<div class="card stat"><div class="big">${num(n)}</div><div class="lbl">${label}</div></div>`).join("")}</div>
    <div class="card"><b>Keep</b> means a report or model dependency was found.
      <b>Deletion candidate</b> means no references were detected. <b>Review</b> means the analysis is incomplete or a dependency is uncertain.
      <p class="mut" style="margin-top:.4rem">${esc(a.scope)}</p></div>
    <div class="filter-row">
      <input id="column-search" class="search" style="margin:0" aria-label="Search columns, measures or sources" placeholder="Search columns, measures, sources…" oninput="filterColumns()">
      <select id="column-assessment" class="search" style="width:auto;margin:0" aria-label="Filter deletion assessment" onchange="filterColumns()">
        <option value="">All assessments</option><option>Keep</option><option>Deletion candidate</option><option>Review</option></select>
      <select id="column-used" class="search" style="width:auto;margin:0" aria-label="Filter report usage" onchange="filterColumns()">
        <option value="">All report usage</option><option value="Yes">Used in report</option><option value="Not detected">No report usage detected</option><option value="Unknown">Usage unknown</option></select>
      <select id="column-page" class="search" style="width:auto;margin:0;max-width:240px" aria-label="Filter report page" onchange="filterColumns()">
        <option value="*">All pages</option><option value="">No specific page</option>
        ${(R?.pages||[]).map(p=>`<option value="${esc(p.id)}">${esc(p.name)} (${esc(p.id)})</option>`).join("")}</select>
      <button class="chip" onclick="downloadColumnCsv()">Export filtered CSV</button>
    </div>
    <p id="column-count" class="mut" aria-live="polite" style="margin-bottom:.5rem"></p>
    <div class="column-scroll"><table class="t"><thead><tr>${headings.map(([key,title])=>
      `<th data-column-sort="${key}"><button class="xl" onclick="sortColumns('${key}')">${title}</button></th>`).join("")}</tr></thead>
      <tbody id="column-rows"></tbody></table></div>`;
}
function filterColumns(){
  const q = document.getElementById("column-search").value.toLowerCase().trim();
  const assessment = document.getElementById("column-assessment").value;
  const used = document.getElementById("column-used").value;
  const page = document.getElementById("column-page").value;
  visibleColumns = DATA.columns.rows.filter(r=>(!q||Object.values(r).join(" ").toLowerCase().includes(q)) &&
    (!assessment||r.decision===assessment) && (!used||r.usedInReport===used) && (page==="*"||r.pageId===page));
  const value = r=>String(r[columnSort.key]??"");
  visibleColumns.sort((a,b)=>columnSort.direction*value(a).localeCompare(value(b),undefined,{numeric:true}) ||
    a.table.localeCompare(b.table) || a.column.localeCompare(b.column) || a.pageId.localeCompare(b.pageId));
  document.getElementById("column-count").textContent = `${visibleColumns.length} rows · ${new Set(visibleColumns.map(r=>JSON.stringify([r.table,r.column]))).size} distinct columns`;
  document.querySelectorAll("[data-column-sort]").forEach(th=>th.setAttribute("aria-sort",
    th.dataset.columnSort===columnSort.key?(columnSort.direction===1?"ascending":"descending"):"none"));
  const list = values=>values.length?values.map(esc).join("<br>"):"—";
  document.getElementById("column-rows").innerHTML = visibleColumns.map(r=>`<tr>
    <td><span class="badge ${r.decision==='Keep'?'b-direct':r.decision==='Review'?'b-warn':'b-info'}">${esc(r.decision)}</span></td>
    <td>${esc(r.usedInReport)}</td><td>${esc(r.table)}</td><td><b>${esc(r.column)}</b></td>
    <td>${esc(r.page)||'—'}${r.pageId?`<div class="mut">${esc(r.pageId)}</div>`:''}</td><td>${esc(r.pageUsage)}</td>
    <td>${list(r.pageMeasures)}</td><td><details><summary>${esc(r.reason)}</summary><div class="body">
    <b>Page evidence</b><p>${list(r.evidence)}</p><b>All dependent measures</b><p>${list(r.usedByMeasures)}</p>
    <b>Dependent calculations</b><p>${list(r.usedByCalculations)}</p><b>Model dependencies</b><p>${list(r.modelDependencies)}</p>
    <b>Bookmarks</b><p>${list(r.bookmarkUsage)}</p><b>Partition sources</b><p>${list(r.source)}</p>
    <b>Source column (model input)</b><p>${esc(r.sourceColumn)||'Unknown'}</p>
    ${r.expression?`<b>Column expression</b><pre class="code">${esc(r.expression)}</pre>`:''}
    <p class="mut">${esc(r.sourceNote)}</p>${r.reviewNotes.length?`<b>Review notes</b><p>${list(r.reviewNotes)}</p>`:''}
    </div></details></td></tr>`).join("") || '<tr><td colspan="8">No columns match these filters.</td></tr>';
}
function sortColumns(key){
  columnSort = {key,direction:columnSort.key===key?-columnSort.direction:1};
  filterColumns();
}
function columnCsv(rows){
  const cell = value=>{
    let s = Array.isArray(value)?value.join("; "):String(value??"");
    if(/^[=+@-]/.test(s.trimStart())||/^[\t\r\n]/.test(s)) s="'"+s;
    return '"'+s.replace(/"/g,'""')+'"';
  };
  const fields = DATA.columns.csvFields;
  return '\uFEFF'+[fields.map(([,title])=>cell(title)).join(','),
    ...rows.map(row=>fields.map(([key])=>cell(row[key])).join(','))].join('\r\n')+'\r\n';
}
function downloadColumnCsv(){
  const url = URL.createObjectURL(new Blob([columnCsv(visibleColumns)],{type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a'); a.href=url; a.download='column-page-usage.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ============================================================ coupler */
function coupler(){
  const mHalf = has.model
    ? `<div class="half"><div class="tag">Semantic model</div><div class="val">${esc(M.name)}</div><div class="sub">${num(M.tables.length)} tables · ${num(M.measures.length)} measures</div></div>`
    : `<div class="half off"><div class="tag">Semantic model</div><div class="val">Not supplied</div><div class="sub">model-side analysis unavailable</div></div>`;
  const rHalf = has.report
    ? `<div class="half"><div class="tag">Report</div><div class="val">${esc(R.name)}</div><div class="sub">${num(R.pages.length)} pages · ${num(R.pages.reduce((a,p)=>a+p.visuals.length,0))} visuals</div></div>`
    : `<div class="half off"><div class="tag">Report</div><div class="val">Not supplied</div><div class="sub">report-side analysis unavailable</div></div>`;
  return `<div class="coupler" role="img" aria-label="Inputs supplied: ${MODE} mode">${mHalf}<div class="joint ${has.linked?'':'off'}">${has.linked?'⟷':'·'}</div>${rHalf}</div>`;
}

/* ============================================================ overview */
function rOverview(){
  const stats = [];
  if(has.model){
    stats.push(["Tables", M.tables.length], ["Columns", M.tables.reduce((a,t)=>a+t.columns.length,0)],
      ["Measures", M.measures.length], ["Relationships", M.relationships.length]);
  }
  if(has.report){
    stats.push(["Pages", R.pages.length], ["Visuals", R.pages.reduce((a,p)=>a+p.visuals.length,0)],
      ["Filters", allFilters().length], ["Bookmarks", R.bookmarks.length]);
  }
  const servers = has.model ? [...new Set(M.tables.flatMap(t=>t.partitions.map(p=>p.source.server)).filter(Boolean))] : [];
  const srcTypes = has.model ? [...new Set(M.tables.flatMap(t=>t.partitions.map(p=>p.source.sourceType)))] : [];
  const unused = has.linked ? L.tableUsage.filter(u=>u.usage==="none") : [];
  const warnCount = allWarnings().filter(w=>w.severity==="warning").length;

  let modeNote = "";
  if(MODE==="semantic-only") modeNote = `<div class="card" style="border-left:3px solid var(--poss)"><b>Semantic-only mode.</b> No report was supplied, so nothing here can be called "unused" — the most this document can say is that a column or table has <i>no internal references</i> within the model itself. External reports, Excel connections, or composite models may still depend on it.</div>`;
  if(MODE==="report-only") modeNote = `<div class="card" style="border-left:3px solid var(--poss)"><b>Report-only mode.</b> No semantic model was supplied, so field references below are <i>unresolved requirements</i>: the report demands them, but this document cannot confirm they exist, distinguish measures from columns, or trace them to a data source.</div>`;

  return `${coupler()}
  <h1>${esc(DATA.title)}</h1>
  <p class="sub">Generated ${esc(DATA.generated)} · mode: <b>${MODE}</b></p>
  ${modeNote}
  <div class="grid c4" style="margin-top:1rem">
    ${stats.map(([l,v])=>`<div class="card stat"><div class="big">${num(v)}</div><div class="lbl">${l}</div></div>`).join("")}
  </div>
  ${has.model?`<h2>Data sources at a glance</h2>
  <div class="card">
    <div class="mut" style="margin-bottom:.4rem">${srcTypes.map(esc).join(" · ")||"No sources detected"}</div>
    ${servers.length?`<div class="pill-list">${servers.map(s=>`<span class="ref">${esc(s)}</span>`).join("")}</div>`:""}
    <div class="mut" style="margin-top:.5rem">Full breakdown in <button class="xl" onclick="switchTab('sources')">Sources</button>.</div>
  </div>`:""}
  ${has.linked?`<h2>Usage verdict</h2>
  <div class="card">
    ${["direct","via measures","possible","none"].map(u=>{
      const n = L.tableUsage.filter(x=>x.usage===u).length;
      return `${usageBadge(u)} <b style="margin-right:1.1rem">${n}</b>`;
    }).join("")}
    ${unused.length?`<div class="mut" style="margin-top:.5rem">Tables with no report references: ${unused.map(u=>tblLink(u.table)).join(", ")} — details in <button class="xl" onclick="switchTab('usage')">Usage</button>.</div>`:""}
  </div>`:""}
  ${warnCount?`<h2>Quality</h2><div class="card">${warnCount} warning${warnCount>1?"s":""} flagged — see <button class="xl" onclick="switchTab('warnings')">Warnings</button>.</div>`:""}`;
}

/* ============================================================ lineage */
function rLineage(){
  return `${coupler()}<h1>Lineage</h1>
  <p class="sub">Source systems → model tables → report pages. Click any node to highlight its paths; click a table node twice to jump to its detail.</p>
  <div class="legend">
    <span><span class="dot" style="background:var(--direct)"></span>direct</span>
    <span><span class="dot" style="background:var(--viam)"></span>via measures</span>
    <span><span class="dot" style="background:var(--poss)"></span>possible</span>
    <span><span class="dot" style="background:var(--none)"></span>no references</span>
  </div>
  <div class="card" style="overflow-x:auto"><div id="lineage-board"></div></div>`;
}
function drawLineage(){
  const board = document.getElementById("lineage-board");
  if(!board) return;
  // group lineage rows into source nodes, table nodes, page nodes
  const srcKey = r => [r.sourceType, r.server, r.database].filter(Boolean).join(" · ") || r.sourceType;
  const sources = [...new Map(L.lineage.map(r=>[srcKey(r), {key:srcKey(r), type:r.sourceType}])).values()];
  const tables = M.tables.map(t=>({name:t.name, usage:usageOf(t.name), type:t.tableType}));
  const pages = R.pages.map(p=>p.name);
  const edgesST = L.lineage.map(r=>({s:srcKey(r), t:r.table}));
  const edgesTP = [];
  for(const u of L.tableUsage){
    const pageSet = new Set();
    for(const w of u.whereUsed){
      const page = w.split(" / ")[0].replace(/^(Page|Visual|Report) filter — /,"");
      const match = pages.find(p=>w.startsWith(p) || page===p);
      if(match) pageSet.add(match);
      if(w.startsWith("Report filter")) pageSet.add("(entire report)");
    }
    for(const p of pageSet) edgesTP.push({t:u.table, p});
  }
  if(edgesTP.some(e=>e.p==="(entire report)")) pages.push("(entire report)");

  const rowH = 34, colW = 300, pad = 14;
  const H = Math.max(sources.length, tables.length, pages.length)*rowH + pad*2;
  const yOf = (i,n) => pad + i*rowH + rowH/2 + (H-pad*2-n*rowH)/2;
  const uColor = u => ({direct:"var(--direct)","via measures":"var(--viam)",possible:"var(--poss)",none:"var(--none)"}[u]||"var(--other)");
  const nodeId = (col,name)=>`ln-${col}-${slug(name)}`;
  let svg = `<svg width="${colW*3}" height="${H}" viewBox="0 0 ${colW*3} ${H}" xmlns="http://www.w3.org/2000/svg" font-size="12">`;
  // edges
  const edge = (x1,y1,x2,y2,cls)=>`<path class="${cls}" d="M${x1},${y1} C${x1+70},${y1} ${x2-70},${y2} ${x2},${y2}" fill="none" stroke="var(--line)" stroke-width="1.4"/>`;
  edgesST.forEach(e=>{
    const si=sources.findIndex(s=>s.key===e.s), ti=tables.findIndex(t=>t.name===e.t);
    if(si<0||ti<0) return;
    svg += edge(206, yOf(si,sources.length), colW+8, yOf(ti,tables.length), `e-s-${slug(e.s)} e-t-${slug(e.t)}`);
  });
  edgesTP.forEach(e=>{
    const ti=tables.findIndex(t=>t.name===e.t), pi=pages.indexOf(e.p);
    if(ti<0||pi<0) return;
    svg += edge(colW+206, yOf(ti,tables.length), colW*2+8, yOf(pi,pages.length), `e-t-${slug(e.t)} e-p-${slug(e.p)}`);
  });
  // nodes
  const node = (x,y,w,label,fill,stroke,id,extra="")=>`<g class="lin-node" id="${id}" ${extra}><rect x="${x}" y="${y-12}" width="${w}" height="24" rx="5" fill="${fill}" stroke="${stroke}" stroke-width="1.2"/><text x="${x+8}" y="${y+4}" fill="var(--ink)">${esc(label.length>30?label.slice(0,29)+"…":label)}</text></g>`;
  sources.forEach((s,i)=>{ svg += node(8, yOf(i,sources.length), 198, s.key, "var(--panel2)", "var(--line)", nodeId("s",s.key), `onclick="linHl('s','${slug(s.key)}')"`); });
  tables.forEach((t,i)=>{ svg += node(colW+8, yOf(i,tables.length), 198, t.name, "#fff", uColor(t.usage), nodeId("t",t.name), `onclick="linHl('t','${slug(t.name)}','${esc(t.name).replace(/'/g,"\\'")}')"`); });
  pages.forEach((p,i)=>{ svg += node(colW*2+8, yOf(i,pages.length), 198, p, "var(--panel2)", "var(--line)", nodeId("p",p), `onclick="linHl('p','${slug(p)}')"`); });
  ["Sources","Model tables","Report pages"].forEach((h,i)=>{ svg += `<text x="${i*colW+8}" y="${12}" font-size="10" fill="var(--ink3)" style="text-transform:uppercase;letter-spacing:.1em;font-family:var(--mono)">${h}</text>`; });
  svg += "</svg>";
  board.innerHTML = svg;
}
let _linLast = null;
function linHl(col, key, tableName){
  const board = document.getElementById("lineage-board");
  if(_linLast === col+key && col==="t" && tableName){ goTable(tableName); return; }
  _linLast = col+key;
  board.querySelectorAll("path").forEach(p=>{ p.setAttribute("stroke","var(--line)"); p.setAttribute("stroke-width","1.4"); });
  board.querySelectorAll(`.e-${col}-${key}`).forEach(p=>{ p.setAttribute("stroke","var(--pbi)"); p.setAttribute("stroke-width","2.6"); p.parentNode.appendChild(p); });
}

/* ============================================================ usage */
function rUsage(){
  const rows = L.tableUsage.map(u=>`
    <tr data-u="${u.usage}">
      <td>${tblLink(u.table)}</td>
      <td>${typeBadge(u.tableType)}</td>
      <td>${usageBadge(u.usage)}</td>
      <td>${u.usage==="direct" ? `<span class="mut">${u.directFields.slice(0,6).map(f=>`<span class="ref">${esc(f)}</span>`).join(" ")}${u.directFields.length>6?` +${u.directFields.length-6} more`:""}</span>`
          : u.usage==="via measures" ? `<span class="mut">through ${u.viaMeasures.map(meaLink).join(", ")}</span>`
          : u.usage==="possible" ? `<span class="mut">active relationship to ${u.relatedUsedTables.map(tblLink).join(", ")}</span>`
          : `<span class="mut">nothing in the report reaches this table</span>`}</td>
      <td class="mut">${u.whereUsed.slice(0,3).map(esc).join("<br>")}${u.whereUsed.length>3?`<br>+${u.whereUsed.length-3} more`:""}</td>
    </tr>`).join("");
  return `${coupler()}<h1>Table usage</h1>
  <p class="sub">How the report actually consumes the model. <b>Direct</b> = a field is bound in a visual, filter, or bookmark. <b>Via measures</b> = reached only inside the DAX of measures the report uses. <b>Possible</b> = connected by an active relationship to a used table, so it may participate in filtering. <b>No references</b> = a removal candidate — verify no other report or Excel connection uses this model first.</p>
  <div class="filter-row">${["all","direct","via measures","possible","none"].map(u=>`<button class="chip ${u==="all"?"on":""}" onclick="fUsage('${u}',this)">${u==="none"?"no references":u}</button>`).join("")}</div>
  <table class="t"><thead><tr><th>Table</th><th>Type</th><th>Verdict</th><th>Evidence</th><th>Where used</th></tr></thead><tbody id="usage-body">${rows}</tbody></table>`;
}
function fUsage(u, chip){
  document.querySelectorAll(".filter-row .chip").forEach(c=>c.classList.remove("on"));
  chip.classList.add("on");
  document.querySelectorAll("#usage-body tr").forEach(tr=>{ tr.style.display = (u==="all"||tr.dataset.u===u)?"":"none"; });
}

/* ============================================================ pages */
function rPages(){
  if(!R.pages.length) return `${coupler()}<div class="empty"><b>No pages found.</b><br>Check that the .Report folder contains definition/pages/.</div>`;
  const cards = R.pages.map(p=>{
    const feeds = {};
    for(const v of p.visuals) for(const f of v.fields){
      const t = f.table || "?";
      (feeds[t] = feeds[t] || new Set()).add(f.field);
    }
    for(const f of p.filters) if(f.table) (feeds[f.table]=feeds[f.table]||new Set()).add(f.field);
    const feedRows = Object.entries(feeds).map(([t,fields])=>{
      const u = usageOf(t);
      return `<tr><td>${has.model?tblLink(t):`<span class="ref">${esc(t)}</span>`} ${u?usageBadge(u):""}</td><td class="mut">${[...fields].map(f=>`<span class="ref">${esc(f)}</span>`).join(" ")}</td></tr>`;
    }).join("");
    const visRows = p.visuals.map(v=>`
      <tr><td><b>${esc(v.title||v.type)}</b>${v.title?`<div class="mut">${esc(v.type)}</div>`:""}</td>
      <td class="mut">${v.fields.map(f=>{
        const label = f.table?`${f.table}[${f.field}]`:`[${f.field}]`;
        const kind = f.kind==="measure"?" (m)":"";
        return `<span class="ref" title="${esc(f.context)}">${esc(label)}${kind}</span>`;
      }).join(" ")||"—"}</td>
      <td class="mut">${v.filters.length? v.filters.map(f=>esc(f.field||"?")).join(", "):"—"}</td></tr>`).join("");
    return `<details id="pg-${slug(p.name)}">
      <summary>${esc(p.name)} ${p.hidden?'<span class="badge b-hidden">hidden</span>':""} ${p.isActive?'<span class="badge b-other">landing page</span>':""}
        <span class="mut" style="font-weight:400;margin-left:auto">${p.visuals.length} visuals</span></summary>
      <div class="body">
        <h2 style="margin-top: .6rem">What feeds this page</h2>
        ${feedRows?`<table class="t"><thead><tr><th>Table</th><th>Fields used</th></tr></thead><tbody>${feedRows}</tbody></table>`:`<p class="mut">No field bindings detected on this page.</p>`}
        <h2>Visuals</h2>
        <table class="t"><thead><tr><th>Visual</th><th>Field bindings</th><th>Visual filters</th></tr></thead><tbody>${visRows}</tbody></table>
        ${p.filters.filter(f=>f.level==="page").length?`<h2>Page-level filters</h2><div class="pill-list">${p.filters.filter(f=>f.level==="page").map(f=>`<span class="ref">${esc(f.table||"?")}[${esc(f.field||"?")}] — ${esc(f.filterType)}${f.raw?`: ${esc(f.raw)}`:""}</span>`).join("")}</div>`:""}
      </div>
    </details>`;
  }).join("");
  return `${coupler()}<h1>Report pages</h1>
  <p class="sub">Every page with its visuals, their field bindings, and a rolled-up "what feeds this page" table.${has.model?"":" Field references are unresolved (report-only mode): they name what the report expects, not what a model confirms."}</p>${cards}`;
}

/* ============================================================ filters */
function rFilters(){
  const fs = allFilters();
  if(!fs.length) return `${coupler()}<h1>Filters</h1><div class="empty"><b>No filters found</b> at report, page, or visual level.</div>`;
  const row = f=>`<tr>
    <td><span class="badge b-other">${esc(f.level)}</span></td>
    <td class="mut">${esc(f.target)}</td>
    <td>${f.table&&has.model?tblLink(f.table):`<span class="ref">${esc(f.table||"?")}</span>`}<span class="ref">[${esc(f.field||"?")}]</span></td>
    <td class="mut">${esc(f.filterType)}</td>
    <td class="mut">${f.raw?esc(f.raw):"—"}</td></tr>`;
  return `${coupler()}<h1>Filters</h1>
  <p class="sub">Every filter the report declares, at all three scopes. Report-level filters apply everywhere; page filters apply to one page; visual filters to a single visual.</p>
  <table class="t"><thead><tr><th>Scope</th><th>Applies to</th><th>Field</th><th>Type</th><th>Condition hint</th></tr></thead>
  <tbody>${fs.map(row).join("")}</tbody></table>`;
}

/* ============================================================ manifest */
function rManifest(){
  const man = reportManifest();
  const res = e => !has.linked ? "" :
    e.resolution==="measure" ? '<span class="badge b-viam">measure</span>' :
    e.resolution==="column" ? '<span class="badge b-direct">column</span>' :
    `<span class="badge b-none">${esc(e.resolution)}</span>`;
  return `${coupler()}<h1>Field manifest</h1>
  <p class="sub">${has.linked
    ? "Every field the report binds, resolved against the model. Broken bindings are flagged in red and also listed under Warnings."
    : "Every field the report demands. Without a model these are <b>unresolved requirements</b> — a rebuild against a new model must provide each one. \u201Cmeasure\u201D / \u201Ccolumn\u201D below reflects only how the report referenced the field, not model-confirmed truth."}</p>
  <input class="search" placeholder="Search fields…" oninput="fMan(this.value)">
  <table class="t"><thead><tr><th>Field</th><th>Referenced as</th>${has.linked?"<th>Resolved</th>":""}<th>Used in</th></tr></thead>
  <tbody>${man.map(e=>`<tr data-s="${esc((e.table||"")+" "+e.field).toLowerCase()}">
    <td><span class="ref">${esc(e.table||"?")}[${esc(e.field)}]</span></td>
    <td class="mut">${esc(e.kind)}</td>
    ${has.linked?`<td>${res(e)}</td>`:""}
    <td class="mut">${e.usedIn.slice(0,4).map(esc).join("<br>")}${e.usedIn.length>4?`<br>+${e.usedIn.length-4} more`:""}</td>
  </tr>`).join("")}</tbody></table>`;
}
function fMan(q){
  q=q.toLowerCase();
  document.querySelectorAll("[data-s]").forEach(tr=>{ tr.style.display = tr.dataset.s.includes(q)?"":"none"; });
}

/* ============================================================ tables */
function rTables(){
  const cards = M.tables.map(t=>{
    const u = usageOf(t.name);
    const srcs = [...new Set(t.partitions.map(p=>{
      const s=p.source; return [s.sourceType,s.server,s.database,s.schema&&s.object?`${s.schema}.${s.object}`:s.object].filter(Boolean).join(" · ");
    }))];
    const colRow = c=>`<tr>
      <td><span class="ref">${esc(c.name)}</span>${c.isCalculated?' <span class="badge b-other">calc</span>':""}${c.isHidden?' <span class="badge b-hidden">hidden</span>':""}</td>
      <td class="mut">${esc(c.dataType)}</td>
      <td class="mut">${has.linked ? esc(c.reportUsage) : (c.internallyReferenced ? "internally referenced" : "no internal references")}</td>
      <td class="mut">${c.dependsOn.length?c.dependsOn.map(d=>`<span class="ref">${esc(d)}</span>`).join(" "):"—"}</td></tr>`;
    return `<details id="tbl-${slug(t.name)}">
      <summary>${esc(t.name)} ${typeBadge(t.tableType)} ${t.isHidden?'<span class="badge b-hidden">hidden</span>':""} ${u?usageBadge(u):""}
        <span class="mut" style="font-weight:400;margin-left:auto">${t.columns.length} cols · ${t.measures.length} measures</span></summary>
      <div class="body">
        ${t.description?`<p class="mut" style="margin:.5rem 0">${esc(t.description)}</p>`:""}
        <h2 style="margin-top:.6rem">Source</h2>
        <div class="pill-list">${srcs.map(s=>`<span class="ref">${esc(s)}</span>`).join("")||'<span class="mut">—</span>'}</div>
        ${t.partitions.some(p=>p.source.nativeQuery)?`<p class="mut" style="margin-top:.3rem">⚠ contains a native SQL query — transformations happen upstream of Power Query.</p>`:""}
        <h2>Columns</h2>
        <table class="t"><thead><tr><th>Column</th><th>Type</th><th>Usage</th><th>Depends on</th></tr></thead><tbody>${t.columns.map(colRow).join("")}</tbody></table>
        ${t.measures.length?`<h2>Measures on this table</h2><div class="pill-list">${t.measures.map(m=>`<span class="ref">${meaLink(m.name)}</span>`).join("")}</div>`:""}
        ${t.hierarchies.length?`<h2>Hierarchies</h2><div class="mut">${t.hierarchies.map(h=>`<b>${esc(h.name)}</b>: ${h.levels.map(esc).join(" → ")}`).join("<br>")}</div>`:""}
        <h2>Partition M / expression</h2>
        ${t.partitions.map(p=>`<div class="mut" style="margin:.2rem 0"><b>${esc(p.name)}</b> · ${esc(p.mode)} · ${esc(p.type)}</div><pre class="code">${hlDAX(p.expression)}</pre>`).join("")}
      </div>
    </details>`;
  }).join("");
  return `${coupler()}<h1>Tables</h1>
  <input class="search" placeholder="Search tables…" oninput="fTbl(this.value)">
  <div id="tbl-list">${cards}</div>`;
}
function fTbl(q){
  q=q.toLowerCase();
  document.querySelectorAll("#tbl-list details").forEach(d=>{
    d.style.display = d.id.replace("tbl-","").toLowerCase().includes(q.replace(/[^\w]+/g,"_"))||d.querySelector("summary").textContent.toLowerCase().includes(q)?"":"none";
  });
}

/* ============================================================ measures */
function rMeasures(){
  const cards = M.measures.map(m=>`
    <details id="mea-${slug(m.name)}">
      <summary>${esc(m.name)}
        ${has.linked ? (m.usedInReport?'<span class="badge b-direct">used in report</span>':'<span class="badge b-none">not used in report</span>') : ""}
        <span class="mut" style="font-weight:400;margin-left:auto">${tblLink(m.table)}</span></summary>

function fMea(q){

/* ============================================================ relationships / ERD */
function rRels(){
  const rows = M.relationships.map(r=>`<tr>
    <td>${tblLink(r.fromTable)}<span class="ref">[${esc(r.fromColumn)}]</span></td>
    <td class="mut">${esc(r.fromCardinality)} → ${esc(r.toCardinality)}</td>
    <td>${tblLink(r.toTable)}<span class="ref">[${esc(r.toColumn)}]</span></td>
    <td>${r.isActive?'<span class="badge b-direct">active</span>':'<span class="badge b-hidden">inactive</span>'}</td>
    <td class="mut">${r.crossFilteringBehavior==="bothDirections"?'<span class="badge b-warn">both</span>':"single"}</td></tr>`).join("");
  return `${coupler()}<h1>Relationships</h1>
  <div class="card" style="overflow-x:auto"><div id="erd"></div>
  <div class="legend"><span><span class="dot" style="background:var(--ink)"></span>active</span><span style="border-bottom:2px dashed var(--ink3);padding-bottom:2px">inactive (dashed)</span></div></div>
  <table class="t"><thead><tr><th>From (many)</th><th>Cardinality</th><th>To (one)</th><th>Status</th><th>Cross-filter</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function drawERD(){
  const host = document.getElementById("erd");
  if(!host) return;
  const inRel = new Set(M.relationships.flatMap(r=>[r.fromTable,r.toTable]));
  const facts = M.tables.filter(t=>t.tableType==="fact" && inRel.has(t.name)).map(t=>t.name);
  const dims  = M.tables.filter(t=>["dimension","date dimension"].includes(t.tableType) && inRel.has(t.name)).map(t=>t.name);
  const other = M.tables.filter(t=>inRel.has(t.name) && !facts.includes(t.name) && !dims.includes(t.name)).map(t=>t.name);
  const cols = [dims, facts, other.length?other:null].filter(Boolean);
  const rowH=44, colW=280, pad=16, boxW=200, boxH=30;
  const H = Math.max(...cols.map(c=>c.length))*rowH + pad*2;
  const pos = {};
  cols.forEach((col,ci)=>col.forEach((name,i)=>{
    pos[name] = {x: ci*colW+pad, y: pad + i*rowH + (H-pad*2-col.length*rowH)/2};
  }));
  let svg = `<svg width="${cols.length*colW}" height="${H}" viewBox="0 0 ${cols.length*colW} ${H}" font-size="12">`;
  for(const r of M.relationships){
    const a=pos[r.fromTable], b=pos[r.toTable];
    if(!a||!b) continue;
    const x1=a.x+boxW/2, y1=a.y+boxH/2, x2=b.x+boxW/2, y2=b.y+boxH/2;
    svg += `<path d="M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}" fill="none" stroke="${r.isActive?"var(--ink2)":"var(--ink3)"}" stroke-width="1.4" ${r.isActive?"":'stroke-dasharray="5 4"'} ${r.crossFilteringBehavior==="bothDirections"?'stroke="var(--warn)"':""}/>`;
  }
  const typeFill = {fact:"var(--factBg)","dimension":"var(--dimBg)","date dimension":"var(--dateBg)"};
  for(const [name,p] of Object.entries(pos)){
    const t = M.tables.find(x=>x.name===name);
    svg += `<g class="lin-node" onclick="goTable('${esc(name).replace(/'/g,"\\'")}')"><rect x="${p.x}" y="${p.y}" width="${boxW}" height="${boxH}" rx="6" fill="${typeFill[t.tableType]||"var(--otherBg)"}" stroke="var(--line)"/><text x="${p.x+10}" y="${p.y+19}" font-weight="600">${esc(name.length>24?name.slice(0,23)+"…":name)}</text></g>`;
  }
  svg += "</svg>";
  const orphans = M.tables.filter(t=>!inRel.has(t.name));
  host.innerHTML = svg + (orphans.length?`<div class="mut" style="margin-top:.4rem">Not on the diagram (no relationships): ${orphans.map(t=>tblLink(t.name)).join(", ")}</div>`:"");
}

/* ============================================================ sources */
function rSources(){
  const groups = {};
  for(const t of M.tables) for(const p of t.partitions){
    const s = p.source;
    const key = [s.sourceType, s.server, s.database].filter(Boolean).join(" · ") || s.sourceType;
    (groups[key] = groups[key] || []).push({table:t.name, part:p});
  }
  const cards = Object.entries(groups).map(([key, rows])=>`
    <div class="card">
      <div class="eyebrow">${esc(rows[0].part.source.sourceType)}</div>
      <div style="font-weight:650;margin:.15rem 0 .5rem">${esc(key)}</div>
      <table class="t"><thead><tr><th>Model table</th><th>Source object</th><th>Mode</th><th></th></tr></thead><tbody>
      ${rows.map(r=>{
        const s=r.part.source;
        const obj = s.schema&&s.object?`${s.schema}.${s.object}`:(s.object||s.detail||"—");
        return `<tr><td>${tblLink(r.table)}</td><td><span class="ref">${esc(obj)}</span></td><td class="mut">${esc(r.part.mode)}</td><td>${s.nativeQuery?'<span class="badge b-warn">native query</span>':""}</td></tr>`;
      }).join("")}</tbody></table>
    </div>`).join("");
  return `${coupler()}<h1>Data sources</h1>
  <p class="sub">Where every table's data comes from, grouped by upstream system. Extracted statically from partition M expressions — parameterised or dynamically built connections may not resolve fully.</p>${cards}`;
}

/* ============================================================ security */
function rSecurity(){
  if(!M.roles.length) return `${coupler()}<h1>Security</h1><div class="empty"><b>No RLS roles defined.</b><br>Every user with access sees all data, subject to workspace permissions.</div>`;
  return `${coupler()}<h1>Security (RLS)</h1>
  ${M.roles.map(r=>`<div class="card">
    <div style="font-weight:650">${esc(r.name)} <span class="badge b-other">${esc(r.modelPermission)}</span></div>
    ${r.tablePermissions.length ? r.tablePermissions.map(tp=>`
      <div class="mut" style="margin-top:.5rem">Filter on ${tblLink(tp.table)}:</div>
      <pre class="code">${hlDAX(tp.filterExpression)}</pre>`).join("")
      : '<p class="mut" style="margin-top:.4rem">No table filters — role restricts nothing by itself.</p>'}
  </div>`).join("")}`;
}

/* ============================================================ warnings */
function rWarnings(){
  const ws = allWarnings();
  if(!ws.length) return `${coupler()}<h1>Warnings</h1><div class="empty"><b>Nothing flagged.</b></div>`;
  return `${coupler()}<h1>Warnings</h1>
  <p class="sub">Static-analysis findings a new developer should know before changing anything.</p>
  <table class="t"><thead><tr><th>Severity</th><th>Category</th><th>Detail</th></tr></thead><tbody>
  ${ws.map(w=>`<tr><td><span class="badge ${w.severity==="warning"?"b-warn":"b-info"}">${esc(w.severity)}</span></td><td>${esc(w.category)}</td><td>${esc(w.message)}</td></tr>`).join("")}
  </tbody></table>`;
}

/* ============================================================ boot */
const RENDER = {columns:rColumns, overview:rOverview, lineage:rLineage, usage:rUsage, pages:rPages,
  filters:rFilters, manifest:rManifest, tables:rTables, measures:rMeasures,
  rels:rRels, sources:rSources, security:rSecurity, warnings:rWarnings};
buildNav();
switchTab(has.model ? "columns" : "overview");
</script>
